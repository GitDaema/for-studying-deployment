# 1. HTTP(80) 접속 시 HTTPS(443)로 자동 전환
server {
    listen 80;
    server_name 3.107.187.58.sslip.io;
    return 301 https://$host$request_uri;
}

# 2. HTTPS(443) 실제 웹 서비스 설정
server {
    listen 443 ssl;
    server_name 3.107.187.58.sslip.io;

    # Certbot이 발급한 SSL 인증서 경로 (Docker 컨테이너 내부 기준)
    ssl_certificate /etc/letsencrypt/live/3.107.187.58.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3.107.187.58.sslip.io/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}