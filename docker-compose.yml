version: '3.8'

services:
  # 1. DB 컨테이너 (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: my-app-db
    restart: always
    # 👇 [추가] MySQL 서버 실행 시 UTF-8 인코딩 강제 적용
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: myapp
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql

  # (backend 및 frontend 설정은 기존과 동일)
  backend:
    build: ./backend
    container_name: my-app-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: myapp
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: my-app-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
