version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: my-app-db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: myapp
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: my-app-backend
    restart: always
    # ports: 항목 제거! (외부에 5000번 포트를 직접 노출하지 않고 Docker 내부망 통신만 이용)
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: myapp
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: my-app-frontend
    restart: always
    ports:
      - "80:80" # 외부 80번 포트로 통합!
      - "443:443" # 👈 HTTPS 포트 추가
    volumes:
      # 👈 EC2 호스트에 저장된 SSL 인증서를 Nginx 컨테이너 내부로 마운트 (읽기 전용 :ro)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  db_data:
